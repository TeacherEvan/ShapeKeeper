<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Unlock ShapeKeeper</title>
    <link rel="icon" href="assets/branding/shape-keeper-mark.svg">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
    <style>
        :root { color-scheme: dark; }
        body {
            margin: 0; min-height: 100vh; display: grid; place-items: center;
            padding: 24px; box-sizing: border-box;
            background:
                radial-gradient(120% 80% at 10% -10%, rgba(245, 183, 39, 0.12), transparent 60%),
                radial-gradient(110% 75% at 95% -5%, rgba(59, 130, 246, 0.12), transparent 62%),
                #0b0e14;
            color: #f6f3eb;
            font: 16px/1.6 "Space Grotesk", system-ui, -apple-system, Segoe UI, sans-serif;
        }
        .shell { width: min(92vw, 460px); }
        .back {
            display: inline-block; margin-bottom: 14px; color: #b9c2d1;
            text-decoration: none; font-size: 0.9rem;
        }
        .back:hover { color: #f5b727; }
        main {
            padding: 32px; border-radius: 20px;
            background: #131822; border: 1px solid rgba(246, 243, 235, 0.14);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.1), 0 24px 60px rgba(0, 0, 0, 0.55);
        }
        h1 { margin: 0 0 8px; font-size: 1.6rem; letter-spacing: -0.02em; }
        p.lead { margin: 0 0 24px; color: #b9c2d1; }
        label { display: block; margin-bottom: 6px; font-weight: 600; }
        input[type=email] {
            width: 100%; box-sizing: border-box; padding: 12px 14px;
            border-radius: 10px; border: 1px solid rgba(246, 243, 235, 0.18);
            background: #1c2432; color: #f6f3eb; font: inherit;
        }
        button {
            width: 100%; min-height: 48px; margin-top: 16px; padding: 13px 16px; border: 0;
            border-radius: 12px; background: #f5b727; color: #0b0e14;
            font: 700 1rem/1.2 inherit; cursor: pointer;
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.45), 0 6px 20px rgba(245, 183, 39, 0.25);
        }
        button.secondary {
            background: #1c2432; color: #f6f3eb;
            border: 1px solid rgba(246, 243, 235, 0.16);
            box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.08);
        }
        button[disabled] { opacity: .45; cursor: not-allowed; box-shadow: none; }
        :focus-visible { outline: 3px solid #f5b727; outline-offset: 3px; }
        #status { min-height: 1.6em; margin-top: 14px; color: #b9c2d1; }
        #status[data-kind=error] { color: #ff8996; }
        #status[data-kind=success] { color: #85e3a5; }
        #keybox {
            display: none; margin-top: 20px; padding: 16px;
            border-radius: 12px; background: #1c2432; border: 1px dashed rgba(245, 183, 39, 0.45);
        }
        #keybox strong {
            display: block; font-family: "Space Mono", ui-monospace, monospace;
            font-size: 1.25rem; letter-spacing: .06em; margin: 8px 0 4px;
            word-break: break-all; color: #fdcf64;
        }
        small { color: #b9c2d1; }
        a { color: #f5b727; }
    </style>
</head>
<body>
    <div class="shell">
    <a class="back" href="/">← Back to ShapeKeeper</a>
    <main>
        <h1>Unlock every level</h1>
        <p class="lead">Levels 1–19 are free. One payment of <strong>R18</strong> (about $1) opens levels 20–100 forever.</p>

        <form id="payform" novalidate>
            <label for="email">Email for your receipt</label>
            <input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
            <button id="pay" type="submit">Pay R18 with Paystack</button>
        </form>

        <p id="status" role="status" data-kind="info"></p>

        <section id="keybox" aria-live="polite">
            <small>Your unlock key — save it, then paste it into the game:</small>
            <strong id="key"></strong>
            <button id="copy" type="button" class="secondary">Copy key</button>
            <button id="back" type="button" class="secondary">Back to game</button>
        </section>

        <p style="margin-top:24px"><small>Secure payment by Paystack. No subscription.</small></p>
    </main>
    </div>

    <script src="config.js"></script>
    <script src="https://js.paystack.co/v1/inline.js"></script>
    <script src="checkout.js"></script>
</body>
</html>
