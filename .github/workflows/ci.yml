name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm install

            - name: Lint
              run: npm run lint

            - name: Unit tests
              run: npm run test

            # E2E (Playwright) requires a live server and a Convex backend, so it
            # is intentionally NOT wired into this required CI gate. Run locally with:
            #   npm run serve &   # or: npm run dev
            #   npx playwright install --with-deps
            #   npm run test:e2e
            # See tests/e2e/ for the full suite.
