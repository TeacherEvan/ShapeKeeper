name: CI

on:
    push:
        branches:
            - main
    pull_request:
        branches:
            - main

permissions:
    contents: read

jobs:
    test:
        runs-on: ubuntu-latest
        steps:
            - name: Checkout code
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: '22'
                  cache: 'npm'

            - name: Install dependencies
              run: npm ci

            - name: Lint
              run: npm run lint

            - name: Convex typecheck
              run: npx convex typecheck

            - name: Unit tests
              run: npm run test

            - name: Build check
              run: npm run build

            - name: Install Playwright Chromium
              run: npx playwright install --with-deps chromium

            - name: E2E Smoke tests
              run: npm run test:e2e:smoke
